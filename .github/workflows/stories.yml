name: Story-Bilder erzeugen

on:
  push:
    branches: [main]
    paths:
      - 'data/news.json'
      - 'data/gesucht.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund sharp
      - run: node scripts/make-stories.mjs
      - name: Bilder committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stories
          git diff --cached --quiet || (git commit -m "Story-Bilder erzeugt" && git push)
